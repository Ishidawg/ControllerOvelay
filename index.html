<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <link href="css/style.css" rel="stylesheet">
</head>

<body>
  <div class="controller-container">
    <div class="d-pad">
      <span class="top">TOP</span>
      <span class="down">DOWN</span>
      <span class="left">LEFT</span>
      <span class="right">RIGTH</span>
    </div>
    <div class="center">
      <span class="select">SELECT</span>
      <span class="home">HOME</span>
      <span class="start">START</span>
    </div>
    <div class="face-buttons">
      <span class="a">A</span>
      <span class="b">B</span>
      <span class="x">X</span>
      <span class="y">Y</span>
    </div>
    <div class="back-buttons">
      <span class="lb">LB</span>
      <span class="lt">LT</span>
      <span class="rb">RB</span>
      <span class="rt">RT</span>
    </div>
    <div class="thumb-buttons">
      <span class="ls">LS</span>
      <span class="rs">RS</span>
    </div>
    <div class="sticks-axis">
      <span class="left-axis"></span>
      <span class="right-axis"></span>
    </div>
  </div>
  <script src="main.js" defer></script>
</body>

</html>
