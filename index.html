<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="style.css" rel="stylesheet">
</head>

<body>
  <!-- controller tags -->
  <div class="controller">
    <img src="assets/controller-skull.png" />

    <!-- directional pad -->
    <img class="dbase" src="assets/dpad/d_base.png" />
    <img class="top hidden" src="assets/dpad/d_up.png" />
    <img class="down hidden" src="assets/dpad/d_down.png" />
    <img class="left hidden" src="assets/dpad/d_left.png" />
    <img class="right hidden" src="assets/dpad/d_right.png" />

    <!-- center buttons -->
    <img class="cbase" src="assets/center_buttons/c_base.png" />
    <img class="select hidden" src="assets/center_buttons/c_select.png" />
    <img class="home hidden" src="assets/center_buttons/c_home.png" />
    <img class="start hidden" src="assets/center_buttons/c_start.png" />

    <!-- face buttons -->
    <img class="a" src="assets/face_buttons/btn_a.png" />
    <img class="b" src="assets/face_buttons/btn_b.png" />
    <img class="x" src="assets/face_buttons/btn_x.png" />
    <img class="y" src="assets/face_buttons/btn_y.png" />

    <!-- back buttons -->
    <img class="lb" src="assets/back_buttons/left/lb.png" />
    <img class="lt" src="assets/back_buttons/left/lt.png" />
    <img class="rb" src="assets/back_buttons/right/rb.png" />
    <img class="rt" src="assets/back_buttons/right/rt.png" />

    <!-- analogs -->
    <img class="ls" src="assets/analogs/ls.png" />
    <img class="rs" src="assets/analogs/rs.png" />
  </div>

  <!-- debug tags -->
  <div class="controller-container">
    <div class="d-pad">
      <span class="debug_top">TOP</span>
      <span class="debug_down">DOWN</span>
      <span class="debug_left">LEFT</span>
      <span class="debug_right">RIGTH</span>
    </div>
    <div class="center">
      <span class="debug_select">SELECT</span>
      <span class="debug_home">HOME</span>
      <span class="debug_start">START</span>
    </div>
    <div class="debug_face-buttons">
      <span class="debug_a">A</span>
      <span class="debug_b">B</span>
      <span class="debug_x">X</span>
      <span class="debug_y">Y</span>
    </div>
    <div class="back-buttons">
      <span class="debug_lb">LB</span>
      <span class="debug_lt">LT</span>
      <span class="debug_rb">RB</span>
      <span class="debug_rt">RT</span>
    </div>
    <div class="thumb-buttons">
      <span class="debug_ls">LS</span>
      <span class="debug_rs">RS</span>
    </div>
    <div class="sticks-axis">
      <span class="debug_left-axis">L_AXIS</span>
      <span class="debug_right-axis">R_AXIS</span>
    </div>
  </div>
  <script src="main.js" defer></script>
</body>

</html>
